# CASTLE Base Configuration
# Reproduces results from: ESWA 299 (2026) 130233
#
# Implementation notes (v2):
#   - attention_dropout=0.1 (Fairseq default; original code)
#   - clip_norm=0.1 (Fairseq default; applied in train.py)
#   - lambda_kg=0, lambda_reg=0 (not used in original training)
#   - Linked attention: MLP gate, pre-softmax, disabled during inference
#   - Decoding: beam_size=5, length_penalty=0.6

model:
  arch: castle_transformer
  encoder_layers: 4
  decoder_layers: 4
  encoder_attention_heads: 8
  decoder_attention_heads: 8
  encoder_embed_dim: 256
  decoder_embed_dim: 256
  encoder_ffn_embed_dim: 2048
  decoder_ffn_embed_dim: 2048
  dropout: 0.3
  attention_dropout: 0.1   # Fairseq default; original code uses 0.1

  # Linked Attention — MLP content-dependent gate (not scalar)
  # Paper reports learned values: a = {0.3000, 0.1415, 0.1383, 0.1285} for layers 0-3
  linked_attn_init: 0.3
  linked_cross_attn_init: 0.3

  # Knowledge Graph integration
  kg_enabled: true
  # Note: KG encoder gate (Eq. 3-6) is NOT active — was placeholder in original code.
  # Only KG logit bias at decoding (Eq. 8) is active.

  # Knowledge-guided decoding bias weights ψ(r) — Eq. (8)
  kg_bias_diksi: 0.15
  kg_bias_ambigu: 0.12
  kg_bias_pleonasm: 0.10
  kg_bias_alternative: 0.05
  kg_string_similarity_threshold: 0.8  # θ for edge matching

tokenizer:
  type: wordpiece
  vocab_size: 10000

training:
  optimizer: adam
  beta1: 0.9
  beta2: 0.98
  lr: 5.0e-4
  lr_scheduler: inverse_sqrt
  warmup_updates: 4000
  label_smoothing: 0.1
  max_tokens: 1024        # Fairseq binding constraint: ~40 samples per mini-batch
  batch_size: 40          # 1024 tokens ÷ 25 avg tokens/sentence ≈ 40 samples
  update_freq: 2          # effective gradient batch = 80 samples (matches paper)
  max_epochs: 10          # 10 epochs × 15,087 steps/epoch ≈ 150,875 total steps
  patience: 5
  fp16: true
  clip_norm: 0.1          # Fairseq default gradient clipping

  # Auxiliary loss weights — set to 0 (not used in original training)
  # Paper describes L_KG (Eq. 10) and L_reg (Eq. 11) but original code used L_CE only.
  lambda_kg: 0.0
  lambda_reg: 0.0

  # Decoding hyperparameters (beam search)
  beam_size: 5
  length_penalty: 0.6

dataset:
  name: syauqie/IGED
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10

knowledge_graph:
  output_path: data/castle_kg_pruned.pkl
  # Relation weights (Table 5)
  relation_weights:
    stem_of: 1.0            # paper Table 5: weight 1.0
    corrected_as_diksi: 0.80
    corrected_as_ambigu: 0.80  # paper Table 5: weight 0.80
    corrected_as_pleonasme: 0.60
    alternative: 0.50
    collocates: 0.30
  # Construction method ratios
  rule_based_ratio: 0.60
  neural_ratio: 0.40
  # DeepSeek batch size for neural extraction
  deepseek_batch_size: 10
  # Statistical collocation params (Algorithm 1, line 29)
  collocation_window: 3
  collocation_threshold: 3
  # Validation thresholds
  levenshtein_threshold: 0.8    # string similarity for morphological linking
  cosine_similarity_threshold: 0.6  # IndoBERT semantic consistency
